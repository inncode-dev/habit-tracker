<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A habit tracker built with React, TypeScript, Tailwind and Zustand. Weekly check-ins, streaks and a three-month heatmap for every habit." />
    <script>
      // Runs before first paint so a dark-theme user never sees a white flash.
      try {
        var t = JSON.parse(localStorage.getItem('inncode-habits:theme'));
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <title>Habit Tracker · InnCode Lab</title>
  </head>
  <body class="bg-paper font-sans text-ink antialiased dark:bg-night dark:text-paper">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
